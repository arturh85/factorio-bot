# `--cfg tokio_unstable` is for tokio-console; `-fuse-ld=mold` picks the fast
# linker (mold comes from flake.nix; gcc 15 here understands the flag).
#
# BOTH LIVE IN THIS ONE ARRAY ON PURPOSE. Cargo does NOT merge
# `build.rustflags` with `target.<triple>.rustflags` -- the target one wins
# outright and this one is ignored entirely. So putting the linker in a
# `[target.x86_64-unknown-linux-gnu]` block would silently drop
# `--cfg tokio_unstable`, and tokio-console would stop working with no error
# at build time. Extend this array; do not add a target block.
#
# Verify both halves at once, in one command (2026-09-07):
#   rustc --cfg tokio_unstable -C link-arg=-fuse-ld=mold x.rs -o t && \
#     readelf -p .comment t | grep mold
# the binary must both see the cfg and report `mold` in .comment.
#
# MOLD DOES NOT SPEED THIS WORKSPACE UP TODAY, and that is measured, not
# assumed: warm-rebuild cpu 66/65/71 s with it against 61/63/70 s without.
# Under `lto = true` + `codegen-units = 1` the time is LLVM fat-LTO codegen
# inside rustc, not ELF linking, so there is nearly nothing for a linker to
# win. It is kept because it costs nothing and becomes the win the moment
# codegen-units is loosened. See
# docs/superpowers/notes/2026-09-07-what-the-build-profile-costs.md
[build]
rustflags = ["--cfg", "tokio_unstable", "-C", "link-arg=-fuse-ld=mold"]

# Cap parallel codegen jobs per cargo invocation.
#
# Cargo defaults to one job per core, which is right for one build on an idle
# box and badly wrong here: several agents work in separate `.worktrees/`
# checkouts at once, each with its own `target/`, so five concurrent builds ask
# for 5 x 20 = 100 parallel jobs on a 20-core machine. Measured 2026-09-06:
# load average 85, 18 GB of swap in use against 30 GB of RAM, and no measured
# run able to start because the five-minute load must be under 6.
#
# Four is deliberate rather than tuned: it is nproc/5, so the handful of
# concurrent builds this repo actually sees land near the core count instead of
# five times over it. A single build is slower in wall time and the box stays
# usable, which is the trade we want -- an over-subscribed box swaps, and
# swapping costs more than the parallelism bought.
#
# This does NOT bound test-time threads. `cargo test` runs each test binary
# with one thread per core on top of this; pass `--test-threads` when a suite
# is heavy.
jobs = 4

[alias]     # command aliases
repl = "run --no-default-features --features repl,lua,tokio-console"