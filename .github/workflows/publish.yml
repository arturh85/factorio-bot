name: "publish"
on:
  push:
    tags:
      - 'v**'

jobs:
  build-publish:
    needs: create-github-release
    name: Build & Publish
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      # Prepare
      - name: 🔥 Checkout code
        uses: actions/checkout@v6
      - name: 🛠️ Install nodejs 16
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: 🛠️ Install rust stable
        # actions-rs was archived in 2022 and declares a Node runtime GitHub
        # has disabled; actionlint reports it as "too old to run".
        # dtolnay/rust-toolchain installs the minimal profile by default and
        # takes the toolchain from the ref, so `profile`/`toolchain` are gone.
        uses: dtolnay/rust-toolchain@stable
      - name: 💾 Cache rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: 🛠️ Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - name: 🛠️ Resolve the pnpm store path
        shell: bash
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      # pnpm's node_modules is a tree of symlinks into the content-addressed
      # store, so caching node_modules without the store restores broken links.
      # Cache the store and let `pnpm install` relink from it instead.
      - name: 💾 Cache javascript dependencies
        uses: actions/cache@v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - name: 🛠️ Install lua and build tools (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y liblua5.4-dev pkg-config
      - name: 🛠️ Install zensical
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: 🛠️ Install zensical package
        if: matrix.platform == 'ubuntu-latest'
        run: pip install zensical
      - name: 🛠️ Install nodejs dependencies
        run: |
          cd app; pnpm install --frozen-lockfile
      - name: 🦠 Update version in package.json
        id: create_version
        run: |
          cd app/scripts; node update-package-version.js

      # Javascript
      - name: 🏗️ Build javascript code
        run: |
          cd app; pnpm run build:web

      # Rust
      - name: 🏗️ Build the server binary
        run: |
          cargo build --release --all-features --timings

      - name: 📦 Stage the release binary
        shell: bash
        run: |
          # Explicit `found` rather than `[ -f x ] && cp x`: that shorter
          # form is safe under `set -e` (bash exempts the left operand of
          # `&&`, verified), but it exits 0 when NEITHER file exists, so a
          # build that produced no binary would publish an empty release
          # instead of failing.
          mkdir -p release-artifacts
          found=0
          for f in target/release/factorio-bot target/release/factorio-bot.exe; do
            if [ -f "$f" ]; then cp "$f" release-artifacts/; found=1; fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no release binary found under target/release/" >&2
            exit 1
          fi
          ls -la release-artifacts/

      # Publish release binary
      # The desktop auto-updater has no server equivalent: release artefacts
      # are now just the factorio-bot binary plus the built app/dist, and
      # updating means replacing the binary.
      - name: 📤️ Upload release binary
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          allowUpdates: true
          replacesArtifacts: false
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          # The SAME expression `create-github-release` tags with (line ~185),
          # not `github.ref_name`. Those two coincide under the documented
          # `cargo release` flow and diverge on a hand-cut tag -- and with
          # `allowUpdates: true` a divergence does not fail, it silently opens
          # a second, changelog-less release and leaves the real one empty.
          # Using one expression removes the invariant instead of asserting it.
          tag: v${{ env.PACKAGE_VERSION }}
          # Named exactly, not globbed: `target/release/factorio-bot*` also
          # matches `factorio-bot.d`, a cargo dep-file listing absolute
          # build-machine source paths, which would be published.
          artifacts: "release-artifacts/*"

      # Prepare gh-pages
      - name: 🏗️ Build rust docs
        if: matrix.platform == 'ubuntu-latest'
        run: |
          mkdir public 
          cargo doc --all --no-deps
          mv target/doc public/doc
      - name: 🏗️ Build zensical documentation
        if: matrix.platform == 'ubuntu-latest'
        run: |
          zensical build --clean
          mv site/* public/
      - name: 🏗️ Build lua api docs
        if: matrix.platform == 'ubuntu-latest'
        uses: ./.github/actions/ldoc/
        with:
          config-path: docs/lua/config.ld
          source-path: docs/lua/src/
      - name: 🏗️ Fix lua api docs permissions & move to public/
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo chown -R $(id -u):$(id -g) doc/
          mv doc/ public/lua/
      - name: 🚚 Move generated docs and stats to public/ folder
        if: matrix.platform == 'ubuntu-latest'
        run: |
          mv app/dist/stats.html public/stats.html
          mv target/cargo-timings/ public/cargo-timings/

      # Publish gh-pages
      - name: 📤 Deploy public/ to gh-pages
        if: matrix.platform == 'ubuntu-latest'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true

  create-github-release:
    name: Create Github Release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create_release.outputs.id }}
      release_body: ${{ steps.release.outputs.release_body }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0
      - name: 🛠️ Install nodejs 16
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: 🦠 Update version in package.json
        run: |
          cd app/scripts; node update-package-version.js
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: Cargo.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
      - name: Set the release body to changelog
        id: release
        shell: bash
        run: |
          # `::set-output::` is REMOVED, not merely deprecated, so this step
          # was silently producing an empty release body. $GITHUB_OUTPUT with
          # a heredoc delimiter carries multi-line values natively, which also
          # retires the %25/%0A/%0D escaping that only existed because
          # set-output was single-line.
          #
          # `printf '%s' "$r"` rather than `printf "$r"`: the changelog is data,
          # and a literal % in a commit message was being read as a format
          # directive.
          r=$(cat "${{ steps.git-cliff.outputs.changelog }}")
          r="$(printf '%s' "$r" | tail -n +3)"
          {
            echo "release_body<<RELEASE_BODY_EOF"
            echo "$r"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"


      - name: 🔖 Create github release
        uses: ncipollo/release-action@v1
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          allowUpdates: true
          replacesArtifacts: false
          name: "Factorio Bot v${{ env.PACKAGE_VERSION }}"
          tag: v${{ env.PACKAGE_VERSION }}
          body: "${{ steps.release.outputs.release_body }}"
          draft: false
          prerelease: true
