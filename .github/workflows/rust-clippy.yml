# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# rust-clippy is a tool that runs a bunch of lints to catch common
# mistakes in your Rust code and help improve your Rust code.
# More details at https://github.com/rust-lang/rust-clippy 
# and https://rust-lang.github.io/rust-clippy/

name: rust-clippy

on:
  push:
    branches: [ "master" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "master" ]
  schedule:
    - cron: '20 8 * * 3'

jobs:
  rust-clippy-analyze:
    name: Analyze rust code
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        # See the note in test.yml: actions-rs is archived and its runtime is
        # disabled, so the SHA pin here pinned something that cannot run.
        # `override` has no equivalent -- dtolnay/rust-toolchain sets the
        # default toolchain, which is what `override: true` was for.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: 💾 Cache rust dependencies
        uses: Swatinem/rust-cache@v2

      # `--all-features` reaches mlua, which links against system lua 5.4 via
      # pkg-config. Without this the clippy run fails in mlua's build script
      # before analysing a single line -- and `continue-on-error: true` below
      # means the job still reports success, so the analysis silently covered
      # nothing. test.yml installs the same two packages for the same reason.
      - name: 🛠️ Install lua and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y liblua5.4-dev pkg-config

      - name: Install required cargo
        run: cargo install clippy-sarif sarif-fmt

      - name: Run rust-clippy
        run:
          cargo clippy
          --all-features
          --message-format=json | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true
