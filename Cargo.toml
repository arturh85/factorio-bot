[workspace]
members = [
    "app/src-tauri",
    "crates/core",
    "crates/doclint",
    "crates/planner",
    "crates/executor",
    "crates/server",
    "crates/scripting",
#    "crates/scripting_rhai",
#    "crates/scripting_rune",
    "crates/scripting_lua",
]
resolver = "2"

# https://doc.rust-lang.org/cargo/reference/profiles.html
# 0: no optimizations
# 1: basic optimizations
# 2: some optimizations
# 3: all optimizations
# "s": optimize for binary size
# "z": optimize for binary size, but also turn off loop vectorization.

# defaults: https://doc.rust-lang.org/cargo/reference/profiles.html#release
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = true
opt-level = "s"


# defaults: https://doc.rust-lang.org/cargo/reference/profiles.html#dev
# THIS is the profile everything should be built with. `cargo build` and
# `cargo test` are the working commands; `--release` is for CI and
# `cargo release` only. Measured 2026-09-07, see
# docs/superpowers/notes/2026-09-07-what-a-build-profile-costs-the-loop.md
#
# `opt-level = 1` on OUR crates is the whole reason this is viable, and it is
# the one setting that must not go back to 0. The offline `plan` loop -- which
# is what this project iterates in -- costs 1.2 s of cpu here against 6.2 s at
# `opt-level = 0`, and 1.3 s on the shipped fat-LTO release binary. So a plain
# `cargo build` now plans as fast as `--release` did, which is what made the
# "always use --release" habit necessary in the first place. That 4.8x is
# exactly the "debug is 4-7x slower" figure CLAUDE.md records; it belongs to
# `opt-level = 0` alone and one notch removes all of it.
#
# It is nearly free to build: a warm rebuild after touching one leaf file is
# ~5 cpu-seconds at EVERY opt-level (0, 1, 2 and 3 all measured at 4.3-5.4),
# because what makes a rebuild expensive is fat LTO, not optimisation. The
# release profile pays ~60 cpu for the same edit.
[profile.dev]
incremental = true
opt-level = 2


# Dependencies are built ONCE and then served by sccache, so optimising them is
# close to free and buys runtime in exactly the places tests and the planner
# spend it (serde, parsing an 865 MB world dump). Our own crates recompile on
# every edit; these do not. That asymmetry is the point.
#
# `opt-level = "z"` was the old value and it was the wrong setting twice over:
# it optimises dependency code for SIZE, which costs runtime, while not being
# meaningfully cheaper to compile than 2 -- and it does not shrink the dev
# binary, which carries 228 MB of debug info regardless.
#
# `debug = false` stays: debug info on dependencies is what nobody steps into.
debug = true
[profile.dev.package."*"]
opt-level = 3
debug = false

# git-cliff config: https://github.com/orhun/git-cliff#configuration-file
[workspace.metadata.git-cliff.changelog]
# changelog header
header = """
# Changelog
"""
# template for the changelog body
# https://tera.netlify.app/docs/#introduction
body = """
{% if version %}\
    ## [{{ version | replace(from="v", to="") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/arturh85/factorio-bot/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""
# remove the leading and trailing whitespaces from the template
trim = true
# changelog footer
footer = """
<!-- generated by git-cliff -->
"""

[workspace.metadata.git-cliff.git]
# allow only conventional commits
# https://www.conventionalcommits.org
conventional_commits = true
# regex for parsing and grouping commits
commit_parsers = [
    { message = "^[fF]eat*", group = "Features"},
    { message = "^[fF]ix*", group = "Bug Fixes"},
    { message = "^[dD]oc*", group = "Documentation"},
    { message = "^[pP]erf*", group = "Performance"},
    { message = "^[rR]efactor*", group = "Refactor"},
    { message = "^[sS]tyle*", group = "Styling"},
    { message = "^[tT]est*", group = "Testing"},
    { message = "^chore\\(release\\): prepare for*", skip = true},
    { message = "^chore*", group = "Miscellaneous Tasks"},
    { body = ".*[sS]ecurity", group = "Security"},
]
# filter out the commits that are not matched by commit parsers
filter_commits = false
# glob pattern for matching git tags
tag_pattern = "v[0-9]*"
# regex for skipping tags
skip_tags = "v0.1.0-beta.1"