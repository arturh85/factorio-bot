[package]
name = "factorio-bot"
version = "0.2.4-dev"
description = "a cross-platform factorio bot platform"
authors = [ "Artur Hallmann <arturh@arturh.de>" ]
license = "MIT"
repository = "https://github.com/arturh85/factorio-bot/"
default-run = "factorio-bot"
edition = "2024"

[lib]
name = "app_lib"
crate-type = ["rlib"]

[[bin]]
name = "factorio-bot" # overwrite binary name
path = "src/main.rs"



[package.metadata.release]
publish = false
tag-name = "v{{version}}"
dev-version = true
dev-version-ext = "dev"

[dependencies]
# workspace
factorio-bot-core = { path = "../../crates/core" }
factorio-bot-server = { path = "../../crates/server", optional = true }
#factorio-bot-scripting-rune = { path = "../../crates/scripting_rune", optional = true }
#factorio-bot-scripting-rhai = { path = "../../crates/scripting_rhai", optional = true }
factorio-bot-scripting-lua = { path = "../../crates/scripting_lua", optional = true }
# The `plan` subcommand plans against a dumped world with no Factorio, no RCON
# and no Lua runtime involved, so it depends on the planner directly rather
# than reaching it through `factorio-bot-scripting-lua`. Not optional: the
# planner is pure, has no system dependencies, and `plan` is the whole reason
# a world dump is worth taking.
factorio-bot-planner = { path = "../../crates/planner" }

# async
tokio = { version = "1", features = ["full", "tracing"] }
console-subscriber = { version = "0.5", optional = true }
# Not optional, and not only for `crates/server`'s benefit: without a
# subscriber installed, every `tracing::` call in the workspace compiles,
# runs, and emits nothing. Seven of them existed for months in that state.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# serializing / deserializing
serde = { version = "1.0", features = [ "derive" ] }
strum = { version = "0.28", features = ["derive"] }
toml = "1.1" # `config show` / `config init` render AppSettings back to TOML

# cli
clap = {version = "4.5.53", optional = true }
clap_complete = {version = "4.5.62", optional = true }

# repl
reedline-repl-rs = { version = "1.3.0", optional = true }

# other
color-eyre = "0.6" # colorful human oriented error reports via panics

[dev-dependencies]
tempfile = "3"
# Only exercised by the `context` tests gated on `feature = "restapi"`, which
# build the same router `serve.rs` does to prove the `--settings` path
# reaches it end to end. Versions match `crates/server`'s so the same axum
# types are used on both sides of `factorio-bot-server`'s public API.
axum = { version = "0.8.9", features = ["json", "tokio", "http1"] }
tower = "0.5.3"
serde_json = { version = "1.0", features = ["raw_value"] }

[build-dependencies]
# `build.rs` uses exactly one of these: `luaify()` calls
# `factorio_bot_scripting_lua::lua_docs::write_lua_docs`. `factorio-bot-server`
# and `serde` were also declared here and referenced by nothing.
factorio-bot-scripting-lua = { path = "../../crates/scripting_lua", optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"


[features]
default = ["restapi", "repl", "cli", "lua"]
cli = ["dep:clap", "dep:clap_complete"]
restapi = ["dep:factorio-bot-server"]
#rhai = ["dep:factorio-bot-scripting-rhai"]
#rune = ["dep:factorio-bot-scripting-rune"]
lua = ["dep:factorio-bot-scripting-lua", "factorio-bot-server?/lua"]
repl = ["reedline-repl-rs/async"]
tokio-console = ["dep:console-subscriber"]
# What `just serve` builds: the axum server plus Lua scripting and the CLI to
# drive it, and nothing else -- no `repl` (irrelevant to serving), and
# deliberately not `tokio-console`, whose debug instrumentation binds a fixed
# port that a second build-of-this-binary (e.g. a game run started alongside
# the viewer) would otherwise contend over. `--all-features` gets `restapi`
# too, but also drags `tokio-console` in with it, which is the trap this
# alias exists so nobody has to rediscover: build the viewer with
# `--no-default-features --features viewer` (or just `just serve`), not
# `--all-features`.
viewer = ["cli", "lua", "restapi"]
