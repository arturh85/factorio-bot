[package]
name = "factorio-bot-core"
version = "0.2.4-dev"
authors = ["Artur Hallmann <arturh@arturh.de>"]
edition = "2024"
# Integration tests are two `[[test]]` targets (`tests/suite.rs`,
# `tests/botbridge.rs`) rather than one auto-discovered binary per file in
# `tests/`; see either file for why.
autotests = false

[package.metadata.release]
tag = false
push = false
publish = false

[dependencies]
rand = "0.10"
rcon = { version = "0.6", features = ["rt-tokio"] }
bb8 = "0.9.1"
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_json = "1.0"
config = "0.15.19"
pathfinding = "4.14"
parking_lot = "0.12"
paris = { version = "1.5", features = ["timestamps", "macros"] }
# Diagnostics. Unlike `paris` this is NOT `#[macro_use]`d: a call site must
# name where it logs, because for months this crate had two logging systems
# and the macros looked identical at the point of use.
tracing = "0.1"
color-eyre = "0.6"
petgraph = { version = "0.8", features = ["serde-1", "stable_graph"] }
indicatif = "0.18.3"
wildmatch = "2.1"
image = "0.25"
imageproc = "0.27"
factorio-blueprint = "0.3"
include_dir = "0.7"
num-traits = "0.2"
runas = "1.2"
async-trait = "0.1"
tokio = { version = "1", features = ["full", "tracing"] }
noisy_float = { version = "0.2", features = ["serde"] }
enum-primitive-derive = "0.3"
unicode-segmentation = "1.12"
strum = { version = "0.28", features = ["derive"] }
dashmap = {version = "6.1", features = ["serde"] }
euclid = {version = "0.22", features = ["serde"] }
smallvec = { version = "1.13", features = ["serde"] }
base64 = "0.23"
ptree = "0.5"
rustc-hash = "2.1"
itertools = "0.15"
alphanumeric-sort = "1.5"
flate2 = "1.0"
tar = "0.4"
liblzma = "0.4"
zip = "8.6"
toml = "1.1"
regex = "1.11"
# Deliberately WITHOUT `preserve_order`. In schemars 0.8 that feature ordered
# schemars' own map; in 1.x schemars uses `serde_json::Map`, so it forwards to
# `serde_json/preserve_order` and switches that map from BTreeMap to IndexMap
# for every crate in the graph -- reordering the keys of every JSON object this
# workspace serialises, wire payloads included. It buys declaration-ordered
# fields in the generated `docs/lua/src/types.lua` and costs a workspace-wide
# change in JSON output. Four tests asserting exact JSON strings catch it if
# anyone re-adds it; this comment is here so nobody has to.
schemars = "1.2"
utoipa = "5.5.0"
mlua = { version = "0.12", features = ["lua54", "serialize", "macros"] }
miette = {version = "7.4", features = ["fancy"] }
thiserror = "2.0"
futures = "0.3"
dirs = "6.0"
#
#[target.'cfg(unix)'.dependencies]
#
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "^0.61.2", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
mockall = "0.15.0"
mockall_double = "0.3.1"
tempfile = "3"

[[test]]
name = "suite"
path = "tests/suite.rs"

[[test]]
name = "botbridge"
path = "tests/botbridge.rs"
