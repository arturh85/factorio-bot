# Template for AppSettings.toml. Copy it into the application data directory
# (Linux: ~/.local/share/factorio-bot/, "-dev" suffix for debug builds).
#
# The section headers are load-bearing: AppSettings is nested
# (crates/core/src/app_settings.rs), so a key written outside its [section]
# merges into nothing and silently keeps its default.

[factorio]
workspace_path = "" # defaults to local_data_dir/workspace
factorio_archive_path = ""
client_count = 2
rcon_port = 4321
rcon_pass = "foobar"
recreate = false
# A map is a seed PLUS the map-gen settings, and a map-exchange string encodes
# both -- which is why the string, not the seed, is a map's identity. Setting it
# makes setup parse it into map-gen-settings.json / map-settings.json and pass
# both to `factorio --create`, so the same seed under a different string is a
# different map.
#
# Empty means "Factorio's defaults for the installed version", which is what
# every archived number in this project was measured on. This shipped a
# 719-character Factorio-1.x string from the project's first commit until
# 2026-09-06; nothing in the record was measured on the map it generates.
map_exchange_string = ""
seed = ""

[restapi]
port = 7492
# Directory holding the built SPA; the API is served without it.
# web_root = "app/dist"

[gui]
enable_autostart = false
enable_restapi = false
