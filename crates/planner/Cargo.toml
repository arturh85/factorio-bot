[package]
name = "factorio-bot-planner"
version = "0.2.4-dev"
authors = ["Artur Hallmann <arturh@arturh.de>"]
edition = "2024"

[package.metadata.release]
tag = false
push = false
publish = false

[dependencies]
factorio-bot-core = { path = "../core", version = "0.2.4-dev" }
miette = { version = "7.4", features = ["fancy"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
# Only for `tests/enclosure_prevention.rs`, which deserialises the same
# run-13 fixture JSON `crates/core/tests/enclosure_run13.rs` does.
serde_json = "1.0"
# Only for `method::blueprint`'s own tests, to build a real blueprint string
# (version byte, base64, zlib, JSON) around a tiny hand-written entity list --
# the same encode helper `crates/core/tests/blueprint_decode.rs` uses, needed
# here because `Goal::Built` takes blueprint TEXT, not a `Blueprint` struct.
base64 = "0.23"
flate2 = "1.0"
