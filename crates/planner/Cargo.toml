[package]
name = "factorio-bot-planner"
version = "0.2.4-dev"
authors = ["Artur Hallmann <arturh@arturh.de>"]
edition = "2024"

[package.metadata.release]
tag = false
push = false
publish = false

[dependencies]
factorio-bot-core = { path = "../core", version = "0.2.4-dev" }
miette = { version = "7.4", features = ["fancy"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
# Only for `tests/enclosure_prevention.rs`, which deserialises the same
# run-13 fixture JSON `crates/core/tests/enclosure_run13.rs` does.
serde_json = "1.0"
