[package]
name = "factorio-bot-scripting-lua"
version = "0.2.4-dev"
authors = ["Artur Hallmann <arturh@arturh.de>"]
edition = "2024"

[package.metadata.release]
tag = false
push = false
publish = false

[dependencies]
factorio-bot-core = { path = "../core" }
factorio-bot-executor = { path = "../executor", version = "0.2.4-dev" }
factorio-bot-planner = { path = "../planner", version = "0.2.4-dev" }
factorio-bot-scripting = { path = "../scripting" }
itertools = "0.15"
mlua = { version = "0.12", features = ["lua54", "serialize", "macros", "async"] }
# rlua_serde = { git = "https://github.com/creepinson/rlua_serde" } # fork which is compatible with rlua 0.19
miette = {version = "7.4", features = ["fancy"] }
thiserror = "2.0"
[dev-dependencies]
# `goal.start`/`goal.run` are tested against a stub `Actuator`, and the trait
# is `#[async_trait]`, so implementing it needs the same macro.
async-trait = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["full", "tracing", "test-util"] }
