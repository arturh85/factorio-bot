[package]
name = "factorio-bot-server"
version = "0.2.4-dev"
authors = ["Artur Hallmann <arturh@arturh.de>"]
edition = "2021"

[package.metadata.release]
tag = false
push = false
publish = false

[dependencies]
factorio-bot-core = { path = "../core" }
factorio-bot-scripting = { path = "../scripting" }
factorio-bot-scripting-lua = { path = "../scripting_lua", optional = true }
axum = { version = "0.8.9", features = ["json", "tokio", "http1"] }
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["fs", "trace", "catch-panic"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "preserve_order"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
tokio = { version = "1", features = ["full", "tracing"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
miette = { version = "7.4", features = ["fancy"] }
thiserror = "2.0"
num-traits = "0.2"
tracing = "0.1"

# Deliberately no `default` set: `app/src-tauri` has separate `lua` and
# `restapi` features, both on by default. If `lua` defaulted on here, building
# the app as `--no-default-features --features restapi` -- server but no
# scripting -- would still pull `factorio-bot-scripting-lua` in through this
# crate's defaults, contradicting the feature the operator turned off.
# `cargo build --no-default-features` is a precommit gate, so the combination
# is exercised rather than theoretical.
[features]
lua = ["dep:factorio-bot-scripting-lua"]

[dev-dependencies]
tempfile = "3"
