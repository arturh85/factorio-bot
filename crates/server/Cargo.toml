[package]
name = "factorio-bot-server"
version = "0.2.4-dev"
authors = ["Artur Hallmann <arturh@arturh.de>"]
edition = "2024"

[package.metadata.release]
tag = false
push = false
publish = false

[dependencies]
factorio-bot-core = { path = "../core" }
factorio-bot-scripting = { path = "../scripting" }
factorio-bot-scripting-lua = { path = "../scripting_lua", optional = true }
axum = { version = "0.8.9", features = ["json", "tokio", "http1"] }
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["fs", "trace", "catch-panic"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "preserve_order"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
tokio = { version = "1", features = ["full", "tracing"] }
# Only the SSE handler in `manage::execute` needs these, and that module exists
# only in a `lua` build -- so they are optional and turned on by that feature
# rather than unconditionally, for the same reason `factorio-bot-scripting-lua`
# is. Both are already in `Cargo.lock` transitively (`tokio-stream/sync` pulls
# `tokio-util`, which is there too), so this adds a declared edge and no new
# third-party code.
tokio-stream = { version = "0.1.19", features = ["sync"], optional = true }
futures-util = { version = "0.3", optional = true }
serde = { version = "1.0", features = ["derive"] }
# `raw_value` lets the SSE handler embed a replay document (already-serialised
# JSON from the executor) into the `data:` line verbatim, instead of it coming
# out as an escaped string a browser would have to `JSON.parse` twice.
serde_json = { version = "1.0", features = ["raw_value"] }
miette = { version = "7.4", features = ["fancy"] }
thiserror = "2.0"
num-traits = "0.2"
tracing = "0.1"

# Deliberately no `default` set: `app/src-tauri` has separate `lua` and
# `restapi` features, both on by default. If `lua` defaulted on here, building
# the app as `--no-default-features --features restapi` -- server but no
# scripting -- would still pull `factorio-bot-scripting-lua` in through this
# crate's defaults, contradicting the feature the operator turned off.
# `cargo build --no-default-features` is a precommit gate, so the combination
# is exercised rather than theoretical.
[features]
lua = ["dep:factorio-bot-scripting-lua", "dep:tokio-stream", "dep:futures-util"]

[dev-dependencies]
tempfile = "3"
# `test-util` only, and only here: it is what `#[tokio::test(start_paused =
# true)]` needs, and the keep-alive test uses a paused clock rather than
# sleeping fifteen real seconds. Not added to the main `tokio` dependency --
# `test-util` in a production build would let a stray `tokio::time::pause()`
# stop the clock for the whole server.
tokio = { version = "1", features = ["test-util"] }
